name: Publish public release
on:
  push:
    branches: [main]
    paths:
      - 'downloads/techmines-plus-*.jar'
      - 'gradle.properties'
      - 'tools/publish_release.py'
      - '.github/workflows/publish-release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-public-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Publish matching public jars and preserve existing download counts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 tools/publish_release.py
